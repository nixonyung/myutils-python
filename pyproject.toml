[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[project]
name = "myutils"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
ollama = [
    "numind>=0.4.5",
    "ollama>=0.6.3",
]
libreyolo = [
    "libreyolo>=1.8.0",
]
all = [
    "myutils[ollama,libreyolo]"
]
